name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KitchenCalendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KitchenCalendar-apk
          path: KitchenCalendar.apk

      # A rolling "latest" release so the newest APK is one tap away from your phone.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KitchenCalendar.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, download KitchenCalendar.apk and open it to install." \
            --prerelease
